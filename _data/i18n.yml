# --- Footer ----------------------------------------------------------
footer_about:
  en: >-
    Radio Angrezi is an experimental ground for sound, music, voice and live
    performance. It broadcasts weekly from its studio at Speicher XI (Bremen)
    on radioangrezi.de, as well as occasionally on 92,5 FM, receivable in the
    Bremen and the surrounding area. In addition special broadcasts covering
    concerts, lectures, presentations and exhibition openings are produced
    regularly.<br/><br/>
    Radio Angrezi is an autonomous student collective, spanning all
    disciplines, study departments and multiple languages. It is open for
    students, teachers and guests. It aims to rise questions, develop new
    conditions, shapes and formats, to perform and to broadcast – collectively
    or individually – to listen, to observe and to discuss.<br/><br/>
    Since 2019, Radio Angrezi has been organizing experimental formats like a
    performance at OUT NOW festival, as part of the summerschool at the
    Biennale di Venezia or locally in Bremen at the Open Space Domshof, the
    Irgendwo or the Güterbahnhof.<br/><br/>
    Interested in broadcasting, performing, supporting, mixing or just hanging
    out? Drop by in Segment 7 in Speicher XI or send a line to
    <a class="black-link" href="mailto:radioangrezi@hfk-bremen.de">radioangrezi@hfk-bremen.de</a>
  de: >-
    Radio Angrezi ist ein Experimentierfeld für Klang, Musik, Stimme und
    Live-Performance. Es sendet wöchentlich aus seinem Studio im Speicher XI
    (Bremen) auf radioangrezi.de sowie gelegentlich auf 92,5 FM, empfangbar in
    Bremen und Umgebung. Darüber hinaus entstehen regelmäßig Sondersendungen zu
    Konzerten, Vorträgen, Präsentationen und Ausstellungseröffnungen.<br/><br/>
    Radio Angrezi ist ein autonomes studentisches Kollektiv – über alle
    Disziplinen, Studiengänge und Sprachen hinweg. Es steht Studierenden,
    Lehrenden und Gästen offen. Es will Fragen aufwerfen, neue Bedingungen,
    Formen und Formate entwickeln, performen und senden – kollektiv oder
    individuell –, zuhören, beobachten und diskutieren.<br/><br/>
    Seit 2019 organisiert Radio Angrezi experimentelle Formate, etwa eine
    Performance beim OUT NOW Festival, im Rahmen der Summer School auf der
    Biennale di Venezia oder lokal in Bremen auf dem Open Space Domshof, im
    Irgendwo oder im Güterbahnhof.<br/><br/>
    Lust zu senden, zu performen, zu unterstützen, zu mischen oder einfach
    abzuhängen? Komm im Segment 7 im Speicher XI vorbei oder schreib uns an
    <a class="black-link" href="mailto:radioangrezi@hfk-bremen.de">radioangrezi@hfk-bremen.de</a>
