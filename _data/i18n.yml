# =====================================================================
#  Radio Angrezi – website texts in English (en) and German (de)
# ---------------------------------------------------------------------
#  HOW TO EDIT
#  - Every fixed text on the website lives here, once per language.
#    Change a text here and it changes everywhere it is used.
#  - HTML is allowed inside texts (links, <br/>, <i>, <b>).
#  - If a "de" text is missing or empty, the English one is shown.
#  - Keep the key names (left of the colon) unchanged; they are what
#    the templates refer to.
#  - Long page texts (special.md, jobs.md) are edited directly in those
#    files, inside their <div class="i18n i18n-en"> / i18n-de blocks.
#
#  NOT TRANSLATED ON PURPOSE (comes from the studio server):
#  show names, show descriptions and show times (LibreTime),
#  the Angrezi Chat, and the archive website.
# =====================================================================

